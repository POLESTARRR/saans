# Pulls current PM2.5 for the covered cities and commits it as a static file.
#
# Two reasons it runs here rather than in the browser. The API key stays in
# repository secrets instead of being visible in page source, and the site needs
# no backend at all: the page just reads a JSON file like any other asset.
name: fetch-air

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch readings
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python engine/fetch_air.py
      - name: Commit if anything changed
        run: |
          git config user.name "Dhruv Sharma"
          git config user.email "dhruvsharma250504@gmail.com"
          git add frontend/data/air/latest.json
          git diff --staged --quiet || git commit -m "Air readings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
